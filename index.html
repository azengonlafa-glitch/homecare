  <body class="bg-canvas text-slate-900 font-sans text-base antialiased selection:bg-purple-100 selection:text-purple-900 min-h-screen">
    <div id="root">

      <style>

2%20cy=%22370.5%22%20r=%2244.64%22%20fill=%22%236DB873%22/%3E%3Ccircle%20cx=%221333.4%22%20cy=%22370.5%22%20r=%2244.64%22%20fill=%22%236DB873%22/%3E%3Ccircle%20cx=%22270%22%20cy=%22435%22%20r=%2238%22%20fill=%22%235DAE63%22/%3E%3Ccircle%20cx=%22300%22%20cy=%22445%22%20r=%2230%22%20fill=%22%236DBB70%22/%3E%3Ccircle%20cx=%22880%22%20cy=%22438%22%20r=%2242%22%20fill=%22%235DAE63%22/%3E%3Ccircle%20cx=%22915%22%20cy=%22448%22%20r=%2230%22%20fill=%22%236DBB70%22/%3E%3C/svg%3E");background-size:var(--tw) 100%;filter:url(#bs-mb2)}
        .bs-near{--tw:100vh;bottom:-2vh;height:30vh;background-image:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%201000%20300%22%3E%3Crect%20x=%220%22%20y=%22195%22%20width=%221000%22%20height=%22105%22%20fill=%22%2358AE5A%22/%3E%3Ccircle%20cx=%22110%22%20cy=%22205%22%20r=%2262%22%20fill=%22%234B9E4F%22/%3E%3Ccircle%20cx=%22170%22%20cy=%22225%22%20r=%2246%22%20fill=%22%235CB45F%22/%3E%3Ccircle%20cx=%22470%22%20cy=%22210%22%20r=%2274%22%20fill=%22%234B9E4F%22/%3E%3Ccircle%20cx=%22545%22%20cy=%22230%22%20r=%2250%22%20fill=%22%235CB45F%22/%3E%3Ccircle%20cx=%22820%22%20cy=%22206%22%20r=%2258%22%20fill=%22%234B9E4F%22/%3E%3Ccircle%20cx=%22880%22%20cy=%22228%22%20r=%2242%22%20fill=%22%235CB45F%22/%3E%3Ccircle%20cx=%2295%22%20cy=%22170%22%20r=%229%22%20fill=%22%23F58FA5%22/%3E%3Ccircle%20cx=%2295%22%20cy=%22170%22%20r=%223.5%22%20fill=%22%23FFF3B0%22/%3E%3Ccircle%20cx=%22140%22%20cy=%22185%22%20r=%229%22%20fill=%22%23FFD25E%22/%3E%3Ccircle%20cx=%22140%22%20cy=%22185%22%20r=%223.5%22%20fill=%22%23FFF3B0%22/%3E%3Ccircle%20cx=%22455%22%20cy=%22160%22%20r=%229%22%20fill=%22%23FFFFFF%22/%3E%3Ccircle%20cx=%22455%22%20cy=%22160%22%20r=%223.5%22%20fill=%22%23FFF3B0%22/%3E%3Ccircle%20cx=%22510%22%20cy=%22175%22%20r=%229%22%20fill=%22%23F58FA5%22/%3E%3Ccircle%20cx=%22510%22%20cy=%22175%22%20r=%223.5%22%20fill=%22%23FFF3B0%22/%3E%3Ccircle%20cx=%22560%22%20cy=%22195%22%20r=%229%22%20fill=%22%23FFD25E%22/%3E%3Ccircle%20cx=%22560%22%20cy=%22195%22%20r=%223.5%22%20fill=%22%23FFF3B0%22/%3E%3Ccircle%20cx=%22800%22%20cy=%22170%22%20r=%229%22%20fill=%22%23FFFFFF%22/%3E%3Ccircle%20cx=%22800%22%20cy=%22170%22%20r=%223.5%22%20fill=%22%23FFF3B0%22/%3E%3Ccircle%20cx=%22850%22%20cy=%22190%22%20r=%229%22%20fill=%22%23F58FA5%22/%3E%3Ccircle%20cx=%22850%22%20cy=%22190%22%20r=%223.5%22%20fill=%22%23FFF3B0%22/%3E%3Cpath%20d=%22M30%20215L38%20177L46%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M100%20215L108%20167L116%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M170%20215L178%20157L186%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M240%20215L248%20177L256%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M310%20215L318%20167L326%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M380%20215L388%20157L396%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M450%20215L458%20177L466%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M520%20215L528%20167L536%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M590%20215L598%20157L606%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M660%20215L668%20177L676%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M730%20215L738%20167L746%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M800%20215L808%20157L816%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M870%20215L878%20177L886%20215Z%22%20fill=%22%233F8F46%22/%3E%3Cpath%20d=%22M940%20215L948%20167L956%20215Z%22%20fill=%22%233F8F46%22/%3E%3C/svg%3E");background-size:var(--tw) 100%;filter:url(#bs-mb3)}
        /* คำว่า growa ตัวใหญ่ลอยอยู่บนท้องฟ้าเหมือนก้อนเมฆ */
        .bs-word{position:absolute;left:0;right:0;top:9vh;font:600 clamp(6rem,min(34vw,46vh),30rem)/1 'Fredoka','Quicksand',ui-rounded,system-ui,sans-serif;letter-spacing:-.03em;color:rgba(255,255,255,.62);user-select:none;pointer-events:none}
        .bs-streak{display:none;position:absolute;left:100%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8))}
        .bs-label{position:absolute;top:max(28px,6vh);left:0;right:0;z-index:3;padding:0 24px}
        /* ไดโนเสาร์ตัวใหญ่ เห็นครึ่งตัว (ล้อหลุดขอบล่าง) 1em = ความสูงตัว / 38 */
        .bs-rider{--H:clamp(420px,min(108vh,150vw),1100px);position:absolute;z-index:2;left:calc(50% + min(4vw,80px));bottom:calc(var(--H) * -0.2);height:var(--H);aspect-ratio:326/480;transform:translateX(-50%);font-size:calc(var(--H) / 38)}
        .bs-dino{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;transform-origin:50% 90%;user-select:none}
        .bs-puffs{position:absolute;left:6%;top:70%;width:0;height:0;z-index:0}
        .bs-puffs i{position:absolute;left:0;top:0;width:2.8em;height:2.8em;margin:-1.4em 0 0 -1.4em;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff 0,#f6faf5 55%,#dceadb 100%);box-shadow:0 .2em .7em rgba(14,74,39,.25);opacity:0}
        .bs-puffs i:nth-child(1){transform:translate(-2.2em,0) scale(1.1);opacity:.95}
        .bs-puffs i:nth-child(2){transform:translate(-6em,-1.4em) scale(1.8);opacity:.85}
        .bs-puffs i:nth-child(3){transform:translate(-11em,-3em) scale(2.5);opacity:.7}
        .bs-puffs i:nth-child(4){transform:translate(-17em,-4.8em) scale(3.1);opacity:.5}
        .bs-puffs i:nth-child(n+5){display:none}
        @media (prefers-reduced-motion:no-preference){
          .bs-layer{animation:bs-scroll var(--dur) linear infinite}
          .bs-far{--dur:70s}
          .bs-mid{--dur:14s}
          .bs-near{--dur:3.2s}
          .bs-streak{display:block;animation:bs-streak 1.2s linear infinite}
          .bs-dino{animation:bs-bob .6s ease-in-out infinite}
          .bs-puffs i{transform:none;opacity:0;animation:bs-puff 2.6s ease-out infinite}
          .bs-puffs i:nth-child(n+5){display:block}
        }
        @keyframes bs-scroll{from{transform:translateX(0)}to{transform:translateX(calc(var(--tw) * -1))}}
        @keyframes bs-streak{from{transform:translateX(0)}to{transform:translateX(-170vw)}}
        @keyframes bs-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.5%) rotate(-.8deg)}}
        @keyframes bs-puff{0%{transform:translate(0,0) scale(.3);opacity:0}12%{opacity:.95}100%{transform:translate(calc(var(--x) * 1em),calc(var(--y) * 1em)) scale(var(--s));opacity:0}}
      </style>
    </div>
    <script>
      // ทำงานก่อนไฟล์ของแอป: ถ้าแอปโหลดหรือเริ่มทำงานไม่สำเร็จ จะเห็นข้อความบนจอแทนหน้าขาว (ใช้ส่งภาพมาแจ้งได้)
      (function () {
        function showError(message) {
          var splash = document.getElementById('boot-splash');
          if (!splash) return; // วาดหน้าแล้ว: ให้ ErrorBoundary ของแอปดูแล
          while (splash.firstChild) splash.removeChild(splash.firstChild);
          var title = document.createElement('p');
          title.style.cssText = 'margin:0;font-size:20px;font-weight:700';
          title.textContent = 'เปิดแอปไม่สำเร็จ';
          var detail = document.createElement('p');
          detail.style.cssText = 'margin:0;font-size:14px;max-width:32rem;word-break:break-word';
          detail.textContent = message;
          var button = document.createElement('button');
          button.textContent = 'โหลดหน้าใหม่';
          button.style.cssText = 'min-height:48px;padding:0 24px;border:0;border-radius:24px;background:#FFE7D0;color:#115C30;font-size:18px;font-weight:700;cursor:pointer';
          button.onclick = function () { window.location.reload(); };
          splash.appendChild(title);
          splash.appendChild(detail);
          splash.appendChild(button);
        }
        window.addEventListener('error', function (e) {
          showError(e.message || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ');
        });
        window.addEventListener('unhandledrejection', function (e) {
          showError(e.reason && e.reason.message ? e.reason.message : String(e.reason));
        });
        window.setTimeout(function () {
          var note = document.getElementById('boot-slow');
          if (note) note.style.display = 'block';
        }, 3000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
